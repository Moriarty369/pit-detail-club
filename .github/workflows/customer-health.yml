name: Check public customer access
on:
  schedule:
    - cron: '43 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Availability, login gate, isolation and security headers
        run: node scripts/probe-customer-deployment.mjs
