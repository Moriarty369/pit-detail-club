name: Deploy customer MVP to Cloudflare Free
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-production
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/cloud-checks.yml
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
      GOOGLE_ENABLED: ${{ vars.GOOGLE_ENABLED }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:cloud
      - name: Apply versioned database migrations
        run: |
          test -n "$SUPABASE_PROJECT_REF"
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db push
      - name: Check authentication settings and publish customer portal
        run: node scripts/deploy-cloud.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: acceso-club
          path: |
            dist-cloud/qr-club.png
            dist-cloud/enlace-club.txt
          retention-days: 30
