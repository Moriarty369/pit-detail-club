name: Verify customer MVP
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify:cloud
      - run: npm run check:cloud:isolation
      - run: npx playwright install --with-deps chromium webkit
      - name: Customer UI, mobile layouts, refresh and point celebrations
        run: npm run test:cloud:ui
      - name: Start disposable PostgreSQL, Auth and email inbox
        run: npx supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Install PostgreSQL 17 backup tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: node scripts/prepare-cloud-tests.mjs
      - name: Real email codes, Auth, TOTP, points, redemption and session revocation
        run: npm run test:cloud:e2e
      - name: Restore encrypted test backup and verify Auth and TOTP
        run: node scripts/test-cloud-restore.mjs
      - name: Shut down test database
        if: always()
        run: npx supabase stop --no-backup
      # Never upload traces, test factors, cookies or database dumps from this public repo.
